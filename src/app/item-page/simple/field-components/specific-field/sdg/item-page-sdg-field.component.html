@if (item?.allMetadata(fields).length) {
  <div class="item-page-field">
    <div class="simple-view-element">
      @if (label) {
        <h2 class="simple-view-element-header">{{ label | translate }}</h2>
      }
      <div class="simple-view-element-body">
        <div class="d-flex flex-wrap justify-content-start gap-2">
          <!-- Iterate over metadata values and send them to the sdgIcon template -->
          @for (mdValue of item?.allMetadata(fields); track mdValue) {
                    <ng-container *ngTemplateOutlet="sdgIcon;
                                                    context: {
                                                        value: mdValue.value
                                                    }">
            </ng-container>
          }
        </div>
      </div>
    </div>
  </div>
}

<!-- Render the UN SDG Goal icon.
See: https://www.un.org/sustainabledevelopment/news/communications-material/
-->
<ng-template #sdgIcon let-value="value">
  <a routerLink="/search" [queryParams]="{ 'f.sdg': value + ',equals' }">
    <img src="assets/images/sdg-icons/E-WEB-Goal-{{ calculateSdgNumber(value) }}.webp" [alt]="value" [title]="value" class="sdg"/>
  </a>
</ng-template>
